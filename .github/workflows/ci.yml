name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadmate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apply migrations + seed to a throwaway Postgres to catch SQL errors.
      - run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/roadmate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          # Public vars are inlined at build; the build never touches the DB.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

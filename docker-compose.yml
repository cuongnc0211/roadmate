# Local dev database (`pnpm db:start`). Production uses Railway Postgres.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadmate
    ports:
      - "5432:5432"
    volumes:
      - roadmate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  roadmate-db:
